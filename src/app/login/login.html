
<div class="container">
    <div style="background: url('https://static.vecteezy.com/system/resources/thumbnails/033/027/755/small_2x/flat-lay-vegetables-on-white-background-food-and-diet-concept-ai-generated-free-photo.jpg'); height: 100vh; background-size: cover;" class="row align-items-center">
        <div class="col-lg-3"></div>
        <div class="col-lg-6 text-center">
            <h1>Login</h1>
            <p>More than 100 plus Recipes from around the world</p>
            <form [formGroup]="loginForm" (ngSubmit)="submitLoginForm()" style="background-color: rgba(0, 0, 0, 0.3);" class="border rounded shadow p-5 mt-5">
                <div class="text-center mb-3 text-light"><h3><i class="fa-solid fa-utensils"></i> Cookpedia</h3></div>
                <div class="text-center mb-3 text-light">
                    <input name="email" formControlName="email" type="text" placeholder="Email" class="form-control">
                </div>
                @if (loginForm.get('email')?.errors && loginForm.get('email')?.touched) {
                    <div class="mb-3 text-danger">*Invalid Email</div>
                }
                <div class="text-center mb-3 text-light">
                    <input name="password" formControlName="password" type="password" placeholder="Password" class="form-control">
                </div>
                @if (loginForm.get('password')?.errors && loginForm.get('password')?.touched) {
                    <div class="mb-3 text-danger">*Invalid Password</div>
                }
                <div class="mb-3 d-grid">
                    <button type="submit" class="btn btn-success">Login</button>
                </div>
            </form>
        </div>
        <div class="col-lg-3"></div>
    </div>
</div>
<app-footer></app-footer>
