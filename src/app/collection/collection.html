<app-header></app-header>
<div class="container">
    <div class="row p-5 bg-success text-center text-light">
        <h1>Recipe Collection</h1>
    </div>
    <div class="row my-5">
        @if (recipeCollection().length>0) {
        <!-- duplicated according to related recipe array -->
            @for (recipe of recipeCollection(); track $index) {
                <div class="col-lg-3">
                    <div class="p-3">
                        <img routerLink="/recipes/{{recipe.recipeId}}" [src]="recipe.image" alt="recipe" class="card-img-top img-fluid">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <h5 class="card-title"> {{recipe.name}} </h5>
                            <button (click)="removeRecipe(recipe._id)" class="btn"><i class="fa-solid fa-trash text-danger"></i></button>
                        </div>
                    </div>
                </div>
            }
        }@else {
            <p class="fw-bolder fs-3 text-danger my-2">Your Recipe Collection is Empty....</p>
        }
    </div>
</div>
<app-footer></app-footer>
