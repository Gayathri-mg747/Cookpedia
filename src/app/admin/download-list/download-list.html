<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2">
            <app-admin-sidebar></app-admin-sidebar>
        </div>
        <div class="col">
            <h1>Download List</h1>
            <table class="table my-5 table-stripped table-hover">
                <thead>
                    <tr class="table-success">
                        <th>#</th>
                        <th>Recipe Id</th>
                        <th>Name</th>
                        <th>Cuisine</th>
                        <th>Count</th>
                    </tr>
                </thead>
                <tbody>
                    @for (recipe of allDownloadsList$ | async; track $index;let i=$index ) {
                        <tr>
                            <td> {{i+1}} </td>
                            <td> {{recipe.recipeId}} </td>
                            <td> {{recipe.name}} </td>
                            <td> {{recipe.cuisine}} </td>
                            <td> {{recipe.count}} </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
